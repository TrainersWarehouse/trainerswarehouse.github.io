body{font-family:'Helvetica Neue',Arial,sans-serif;background:#fff;color:#1B2D4F}

.vbtn.on{background:#1B2D4F;color:#fff;border-color:#1B2D4F}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0.75rem;align-items:center}
.filter-label{font-size:11px;color:#718096}
.chip{font-size:11px;padding:3px 10px;border-radius:20px;cursor:pointer;border:1px solid #DDD8D0;background:#fff;color:#718096}
.chip.on-tmn{background:#F2D0D8;color:#7B1535;border-color:#C0304F}
.chip.on-hrdq{background:#C8DFF7;color:#0C3A6B;border-color:#2A7DC4}
.chip.on-ti{background:#C8EAD0;color:#1A5C2E;border-color:#2E8B4A}
.chip.on-ss{background:#FFE0C2;color:#7A3000;border-color:#E8600A}

.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-title{font-size:17px;font-weight:700;color:#1B2D4F}
.nav-btn{padding:5px 12px;font-size:14px;cursor:pointer;border-radius:6px;border:1px solid #DDD8D0;background:#fff;color:#1B2D4F;font-weight:600}
.nav-btn:hover{background:#f0ede8}
.grid-hdr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-bottom:2px}
.grid-hdr div{text-align:center;font-size:11px;font-weight:600;color:#718096;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-cell{min-height:84px;border-radius:6px;border:1px solid #e8e4de;padding:4px;background:#fff;overflow:hidden}
.cal-cell.other{background:#faf8f5;opacity:0.5}
.cal-cell.today{border-color:#2A7DC4}
.cal-cell.today .day-num{background:#2A7DC4;color:#fff;border-radius:50%}
.cal-cell.has-ss{border-color:#E8600A;border-width:2px}
.day-num{font-size:12px;font-weight:600;color:#718096;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.pill{font-size:10px;padding:2px 4px;border-radius:4px;margin-bottom:2px;cursor:pointer;line-height:1.4;white-space:normal;word-break:break-word;display:block;width:100%;text-align:left;border:none}
.pill:hover{opacity:0.75}
.pill.ss-pill{font-weight:700}

.s-hrdq{background:#C8DFF7;color:#0C3A6B}
.s-ti{background:#C8EAD0;color:#1A5C2E}

.list-ev.ss-ev{border-color:#E8600A;border-width:2px;background:#FFFAF6}
.ev-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}

.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-wrap.open{display:flex}
.modal{background:#fff;border:1px solid #DDD8D0;border-radius:12px;padding:1.5rem;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 8px 40px rgba(0,0,0,0.18)}

.modal-meta{font-size:13px;color:#4A5568;margin-bottom:12px;line-height:1.75}
.modal-x{position:absolute;top:12px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:#718096;padding:2px 6px;line-height:1}
.modal-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:8px 16px;border-radius:6px;background:#E8600A;color:#fff;text-decoration:none;font-weight:600;margin-top:4px;transition:background 0.15s}

let curMonth=new Date();curMonth.setDate(1);
let filters={tmn:true,hrdq:true,ti:true,ss:true};

function toggleF(s){
  filters[s]=!filters[s];
  const el=document.getElementById('f-'+s);
  el.className=filters[s]?'chip on-'+s:'chip';
  render();
}
function setView(v){
  view=v;
  document.getElementById('calView').style.display=v==='cal'?'':'none';
  document.getElementById('listView').style.display=v==='list'?'':'none';
  document.getElementById('bCal').className='vbtn'+(v==='cal'?' on':'');
  document.getElementById('bList').className='vbtn'+(v==='list'?' on':'');
  render();
}
function changeM(d){curMonth.setMonth(curMonth.getMonth()+d);renderCal();}
function filtered(){
  // Always sort S&S first, then others
  return events
    .filter(e=>filters[e.source])
    .sort((a,b)=>{
      if(a.source==='ss'&&b.source!=='ss') return -1;
      if(b.source==='ss'&&a.source!=='ss') return 1;
      return 0;
    });
}
function render(){view==='cal'?renderCal():renderList();}

function renderCal(){
  const y=curMonth.getFullYear(),m=curMonth.getMonth();
  document.getElementById('mTitle').textContent=curMonth.toLocaleString('default',{month:'long',year:'numeric'});
  const grid=document.getElementById('calGrid');grid.innerHTML='';
  const firstDay=new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate();
  const today=new Date();
  const byDay={};
  filtered().forEach(e=>{
    const ed=new Date(e.date+'T12:00:00');
    if(ed.getFullYear()===y&&ed.getMonth()===m){
      const k=ed.getDate();(byDay[k]=byDay[k]||[]).push(e);
    }
  });
  const prevDim=new Date(y,m,0).getDate();
  for(let i=0;i<firstDay;i++) grid.appendChild(mkCell(prevDim-firstDay+1+i,true,false,[]));
  for(let d=1;d<=dim;d++){
    const isT=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;
    grid.appendChild(mkCell(d,false,isT,byDay[d]||[]));
  }
  const rem=42-(firstDay+dim);
  for(let d=1;d<=rem;d++) grid.appendChild(mkCell(d,true,false,[]));
}

function mkCell(day,other,isT,evs){
  const c=document.createElement('div');
  const hasSS=evs.some(e=>e.source==='ss');
  c.className='cal-cell'+(other?' other':'')+(isT?' today':'')+(hasSS?' has-ss':'');
  const n=document.createElement('div');n.className='day-num';n.textContent=day;c.appendChild(n);

  // S&S events always shown first and never hidden
  const ssEvs=evs.filter(e=>e.source==='ss');
  const otherEvs=evs.filter(e=>e.source!=='ss');

  // Show all S&S events
  ssEvs.forEach(e=>{
    const p=document.createElement('button');
    p.className='pill s-ss ss-pill';
    p.textContent=e.title;p.title=e.title;
    p.onclick=()=>openMod(e);c.appendChild(p);
  });

  // Show up to (2 - ssEvs.length) other events, rest go to +more
  const otherSlots=Math.max(0, 2-ssEvs.length);
  otherEvs.slice(0,otherSlots).forEach(e=>{
    const p=document.createElement('button');
    p.className='pill '+SRC[e.source].cls;
    p.textContent=e.title;p.title=e.title;
    p.onclick=()=>openMod(e);c.appendChild(p);
  });
  const hiddenCount=otherEvs.length-otherSlots;
  if(hiddenCount>0){
    const more=document.createElement('button');more.className='more';
    more.textContent='+'+hiddenCount+' more';
    more.onclick=()=>openMod(otherEvs[otherSlots]);
    c.appendChild(more);
  }
  return c;
}

function renderList(){
  const lv=document.getElementById('listView');lv.innerHTML='';
  const evs=filtered().sort((a,b)=>{
    const dateDiff=new Date(a.date)-new Date(b.date);
    if(dateDiff!==0) return dateDiff;
    if(a.source==='ss'&&b.source!=='ss') return -1;
    if(b.source==='ss'&&a.source!=='ss') return 1;
    return 0;
  });
  if(!evs.length){lv.innerHTML='<div style="padding:2rem;text-align:center;color:#718096;font-size:14px">No events match the current filters.</div>';return;}
  const byDay={};
  evs.forEach(e=>{
    const k=new Date(e.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
    (byDay[k]=byDay[k]||[]).push(e);
  });
  Object.entries(byDay).forEach(([day,es])=>{
    const sec=document.createElement('div');sec.className='list-day';
    sec.innerHTML='<div class="list-day-hdr">'+day+'</div>';
    es.forEach(e=>{
      const isSS=e.source==='ss';
      const row=document.createElement('div');
      row.className='list-ev'+(isSS?' ss-ev':'');
      row.onclick=()=>openMod(e);
      row.innerHTML=`<div class="ev-dot" style="background:${SRC[e.source].dot}"></div>
        <div style="flex:1;min-width:0">
          <div class="ev-title${isSS?' ss-title':''}">${esc(e.title)}<span class="sbadge ${SRC[e.source].cls}">${SRC[e.source].name}</span></div>
          <div class="ev-meta">${e.time||''}</div>
        </div>`;
      sec.appendChild(row);
    });
    lv.appendChild(sec);
  });
}

function openMod(e){
  document.getElementById('mBadge').textContent=SRC[e.source].name;
  document.getElementById('mBadge').className='modal-source-badge '+SRC[e.source].cls;
  document.getElementById('mTitle2').textContent=e.title;
  document.getElementById('mMeta').innerHTML=
    '<strong>Date:</strong> '+new Date(e.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'<br>'+
    (e.time?'<strong>Time:</strong> '+esc(e.time)+'<br>':'')+
    (e.desc?'<br>'+esc(e.desc):'');
  document.getElementById('mLink').href=e.url||SRC[e.source].url;
  document.getElementById('mWrap').className='modal-wrap open';
}
function closeMod(ev){
  if(ev&&ev.target!==document.getElementById('mWrap'))return;
  document.getElementById('mWrap').className='modal-wrap';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
renderCal();
</script>
</body>
</html>
