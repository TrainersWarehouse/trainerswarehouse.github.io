
<h2 class="sr-only">Aggregated training events calendar from Training Mag Network, HRDQ, Training Industry, and Show & Share</h2>
<style>
*{box-sizing:border-box}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.cal-title{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.grid-hdr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-bottom:2px}
.grid-hdr div{text-align:center;font-size:11px;font-weight:500;color:var(--color-text-secondary);padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-cell{min-height:80px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);padding:4px;background:var(--color-background-primary);overflow:hidden}
.cal-cell.other{background:var(--color-background-tertiary);opacity:0.45}
.cal-cell.today .day-num{background:#378ADD;color:#fff;border-radius:50%}
.day-num{font-size:12px;font-weight:500;color:var(--color-text-secondary);width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-bottom:2px;flex-shrink:0}
.pill{font-size:10px;padding:2px 4px;border-radius:4px;margin-bottom:2px;cursor:pointer;line-height:1.4;white-space:normal;word-break:break-word;display:block;width:100%}
.pill:hover{opacity:0.75}
.more{font-size:10px;color:var(--color-text-tertiary);cursor:pointer;padding:1px 2px}
.s-tmn{background:#B5D4F4;color:#0C447C}
.s-hrdq{background:#C0DD97;color:#27500A}
.s-ti{background:#F5C4B3;color:#712B13}
.s-ss{background:#E1D4F6;color:#3C3489}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:0.75rem}
.leg{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--color-text-secondary)}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:0.75rem}
.vbtn{padding:4px 10px;font-size:12px;cursor:pointer;border-radius:var(--border-radius-md)}
.vbtn.on{background:var(--color-background-secondary)}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0.75rem}
.chip{font-size:11px;padding:3px 10px;border-radius:20px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary)}
.chip.on-tmn{background:#B5D4F4;color:#0C447C;border-color:#378ADD}
.chip.on-hrdq{background:#C0DD97;color:#27500A;border-color:#639922}
.chip.on-ti{background:#F5C4B3;color:#712B13;border-color:#D85A30}
.chip.on-ss{background:#E1D4F6;color:#3C3489;border-color:#7F77DD}
.list-view{margin-top:0.25rem}
.list-day{margin-bottom:1rem}
.list-day-hdr{font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:6px;padding-bottom:4px;border-bottom:0.5px solid var(--color-border-tertiary)}
.list-ev{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);margin-bottom:6px;cursor:pointer}
.list-ev:hover{background:var(--color-background-secondary)}
.ev-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.ev-title{font-size:13px;font-weight:500;color:var(--color-text-primary);margin:0 0 2px}
.ev-meta{font-size:11px;color:var(--color-text-secondary)}
.sbadge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:6px}
.modal-wrap{position:absolute;inset:0;background:rgba(0,0,0,0.28);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:50px}
.modal-wrap.open{display:flex}
.modal{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;max-width:400px;width:92%;max-height:70vh;overflow-y:auto;position:relative}
.modal-ttl{font-size:15px;font-weight:500;color:var(--color-text-primary);margin:0 0 8px;padding-right:24px}
.modal-meta{font-size:12px;color:var(--color-text-secondary);margin-bottom:10px;line-height:1.7}
.modal-x{position:absolute;top:10px;right:12px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--color-text-secondary);padding:2px 6px}
.modal-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:5px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);color:var(--color-text-primary);text-decoration:none;margin-top:6px}
.add-panel{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:1rem;background:var(--color-background-secondary)}
.add-panel h3{font-size:14px;font-weight:500;margin:0 0 12px;color:var(--color-text-primary)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.form-row.full{grid-template-columns:1fr}
.form-row label{font-size:11px;color:var(--color-text-secondary);display:block;margin-bottom:3px}
.form-row input{width:100%;font-size:12px;padding:5px 8px}
.add-btn{font-size:12px;padding:5px 14px;cursor:pointer;margin-top:4px}
.toggle-add{font-size:12px;padding:4px 12px;cursor:pointer;display:flex;align-items:center;gap:5px}
</style>

<div style="position:relative;padding:1rem 0" id="app">

<div class="legend">
  <div class="leg"><div class="leg-dot" style="background:#378ADD"></div>Training Mag Network</div>
  <div class="leg"><div class="leg-dot" style="background:#639922"></div>HRDQ</div>
  <div class="leg"><div class="leg-dot" style="background:#D85A30"></div>Training Industry</div>
  <div class="leg"><div class="leg-dot" style="background:#7F77DD"></div>Show &amp; Share</div>
</div>

<div class="filter-row">
  <span style="font-size:11px;color:var(--color-text-secondary);align-self:center">Filter:</span>
  <button class="chip on-tmn" id="f-tmn" onclick="toggleF('tmn')">Training Mag Network</button>
  <button class="chip on-hrdq" id="f-hrdq" onclick="toggleF('hrdq')">HRDQ</button>
  <button class="chip on-ti" id="f-ti" onclick="toggleF('ti')">Training Industry</button>
  <button class="chip on-ss" id="f-ss" onclick="toggleF('ss')">Show &amp; Share</button>
</div>

<div class="controls">
  <button class="vbtn on" id="bCal" onclick="setView('cal')">Calendar</button>
  <button class="vbtn" id="bList" onclick="setView('list')">List</button>
  <div style="flex:1"></div>
  <button class="toggle-add" onclick="toggleAdd()"><i class="ti ti-plus" aria-hidden="true"></i> Add Show &amp; Share</button>
</div>

<div class="add-panel" id="addPanel" style="display:none">
  <h3><i class="ti ti-calendar-plus" aria-hidden="true" style="font-size:14px;vertical-align:-1px;margin-right:5px"></i>Add a Show &amp; Share event</h3>
  <div class="form-row">
    <div><label>Title</label><input id="ss-title" placeholder="e.g. Roll Up Your Sleeves"></div>
    <div><label>Date</label><input id="ss-date" type="date"></div>
  </div>
  <div class="form-row">
    <div><label>Time</label><input id="ss-time" placeholder="e.g. 12:00 PM ET"></div>
    <div><label>Registration URL</label><input id="ss-url" placeholder="https://..."></div>
  </div>
  <div class="form-row full">
    <div><label>Description (optional)</label><input id="ss-desc" placeholder="Brief description"></div>
  </div>
  <button class="add-btn" onclick="addSS()"><i class="ti ti-check" aria-hidden="true"></i> Add to calendar</button>
  <span id="add-msg" style="font-size:11px;color:green;margin-left:10px"></span>
</div>

<div id="calView">
  <div class="cal-header">
    <button class="vbtn" onclick="changeM(-1)" aria-label="Previous month">‹</button>
    <div class="cal-title" id="mTitle"></div>
    <button class="vbtn" onclick="changeM(1)" aria-label="Next month">›</button>
  </div>
  <div class="grid-hdr"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<div id="listView" style="display:none" class="list-view"></div>

<div class="modal-wrap" id="mWrap" onclick="closeMod(event)">
  <div class="modal">
    <button class="modal-x" onclick="closeMod(null)" aria-label="Close">×</button>
    <h3 class="modal-ttl" id="mTitle2"></h3>
    <div class="modal-meta" id="mMeta"></div>
    <a class="modal-link" id="mLink" target="_blank"><i class="ti ti-external-link" aria-hidden="true" style="font-size:13px"></i> Register / view event</a>
  </div>
</div>

</div>

<script>
const SRC={
  tmn:{name:'Training Mag Network',url:'https://trainingmagnetwork.com/calendar',dot:'#378ADD',cls:'s-tmn'},
  hrdq:{name:'HRDQ',url:'https://hrdqu.com/events-all-topics/',dot:'#639922',cls:'s-hrdq'},
  ti:{name:'Training Industry',url:'https://trainingindustry.com/webinar/',dot:'#D85A30',cls:'s-ti'},
  ss:{name:'Show & Share',url:'https://trainerswarehouse.com/pages/show-and-share',dot:'#7F77DD',cls:'s-ss'}
};

let events=[
  // Training Mag Network
  {title:'You Are the Experience: What Your Audience Actually Responds To',date:'2026-06-11',time:'9:00 AM PT / 12:00 PM ET',source:'tmn',url:'https://www.trainingmagnetwork.com/events/4477',desc:'Kassy LaBorie on what audiences actually respond to in live virtual sessions.'},
  {title:'Book Launch: Building a Culture of Evaluation—The New Era of Kirkpatrick',date:'2026-06-11',time:'12:00 PM PT / 3:00 PM ET',source:'tmn',url:'https://www.trainingmagnetwork.com/events/4515',desc:'Vanessa Alzate on the new era of Kirkpatrick, performance & impact.'},
  {title:'Negotiation Training: How to Become Unbeatable for Leaders & Sales',date:'2026-06-16',time:'9:00 AM PT / 12:00 PM ET',source:'tmn',url:'https://www.trainingmagnetwork.com/events/4509',desc:'Dr. Klaus Lassert on negotiation strategies for leaders and sales professionals.'},
  {title:'Raise the Bar. Raise Your People. High Expectations Without Burnout',date:'2026-06-16',time:'12:00 PM PT / 3:00 PM ET',source:'tmn',url:'https://www.trainingmagnetwork.com/events/4479',desc:'Kory Kogon of FranklinCovey on setting high expectations without burning teams out.'},
  {title:'Adobe Captivate 13.1 Unboxed: New Features, Faster Workflows',date:'2026-06-17',time:'9:00 AM PT / 12:00 PM ET',source:'tmn',url:'https://www.trainingmagnetwork.com/events/4505',desc:'Sharath Ramaswamy walks through the latest Adobe Captivate features and workflows.'},
  {title:'The New Reality Facing Leadership Development in 2026',date:'2026-06-17',time:'12:00 PM PT / 3:00 PM ET',source:'tmn',url:'https://www.trainingmagnetwork.com/events/4503',desc:'Jared Jones of Lone Rock Consulting on the shifting leadership development landscape.'},
  {title:'Leadership Development Trends: High-Tech + High-Touch Leadership',date:'2026-06-18',time:'9:00 AM PT / 12:00 PM ET',source:'tmn',url:'https://www.trainingmagnetwork.com/events/4476',desc:'Michael Leimbach of Wilson Learning on leading-edge leadership development practices.'},
  {title:'What Video Learners Really Want: Key Findings on Video Effectiveness',date:'2026-06-18',time:'12:00 PM PT / 3:00 PM ET',source:'tmn',url:'https://www.trainingmagnetwork.com/calendar',desc:'Matt Pierce of TechSmith/Camtasia on what makes video learning effective.'},
  {title:'Dear AI: What Have You Done for Me Lately?',date:'2026-06-23',time:'9:00 AM PT / 12:00 PM ET',source:'tmn',url:'https://www.trainingmagnetwork.com/calendar',desc:'Rick Altman of BetterPresenting.com explores practical AI applications for trainers.'},
  {title:'The AI Implementation Guide for L&D: Book Release Celebration',date:'2026-06-24',time:'9:00 AM PT / 12:00 PM ET',source:'tmn',url:'https://www.trainingmagnetwork.com/calendar',desc:'Book release celebration for the AI Implementation Guide for L&D.'},
  // HRDQ
  {title:'10 Communications Mistakes Leaders Unknowingly Make',date:'2026-06-24',time:'2:00 PM ET',source:'hrdq',url:'https://hrdqu.com/events-all-topics/',desc:'Uncover the 10 communications mistakes leaders unknowingly make and how to fix them.'},
  // Training Industry
  {title:'Training Industry Webinar',date:'2026-06-05',time:'1:00 PM ET',source:'ti',url:'https://trainingindustry.com/webinar/',desc:'Upcoming Training Industry webinar — visit the site to see topic and register.'},
  // Show & Share
  {title:'Gameshow Pro Introduces New Features Demo',date:'2026-06-18',time:'12:00 PM ET',source:'ss',url:'https://us06web.zoom.us/meeting/register/tZcuc--gqzooGtYEL0h1EdbtQb-LoUulvfjq',desc:'Dan Yaman shares new Me First Integration tips and other facilitation tips.'},
  {title:'Instructional Origami with Katrina Kennedy',date:'2026-06-25',time:'12:00 PM ET',source:'ss',url:'https://us06web.zoom.us/meeting/register/tZcuc--gqzooGtYEL0h1EdbtQb-LoUulvfjq',desc:'See how a few paper folds can yield incredible learning and retention.'},
  {title:'Facilitate an Online Listening Activity with Kassy LaBorie',date:'2026-07-09',time:'12:00 PM ET',source:'ss',url:'https://us06web.zoom.us/meeting/register/tZcuc--gqzooGtYEL0h1EdbtQb-LoUulvfjq',desc:'Kassy LaBorie shares a fantastic listening exercise perfect for online events.'},
  {title:'Debrief Activities Drawing on Improvisational Thinking',date:'2026-07-23',time:'12:00 PM ET',source:'ss',url:'https://us06web.zoom.us/meeting/register/tZcuc--gqzooGtYEL0h1EdbtQb-LoUulvfjq',desc:'Artrell Williams draws on improv techniques to debrief learning activities.'},
  {title:'Building Resilience & Grit with Patrick Nugent',date:'2026-07-30',time:'12:00 PM ET',source:'ss',url:'https://us06web.zoom.us/meeting/register/tZcuc--gqzooGtYEL0h1EdbtQb-LoUulvfjq',desc:'US Marine Vet and Invictus Games Medalist shares tools to build resilience.'},
  {title:'Peer Review Your Training with Jazmin Webster',date:'2026-08-27',time:'12:00 PM ET',source:'ss',url:'https://us06web.zoom.us/meeting/register/tZcuc--gqzooGtYEL0h1EdbtQb-LoUulvfjq',desc:'Explore ways to test your training session before you go live using peer reviews.'},
  {title:'We! Connect Future Focused Deck with Chad Littlefield',date:'2026-09-24',time:'12:00 PM ET',source:'ss',url:'https://us06web.zoom.us/meeting/register/tZcuc--gqzooGtYEL0h1EdbtQb-LoUulvfjq',desc:'Chad Littlefield, expert on trust-building questions, shares his latest future-focused conversation tool.'},
];

let view='cal';
let curMonth=new Date(2026,5,1);
let filters={tmn:true,hrdq:true,ti:true,ss:true};

function toggleF(s){
  filters[s]=!filters[s];
  const el=document.getElementById('f-'+s);
  el.className=filters[s]?'chip on-'+s:'chip';
  render();
}
function setView(v){
  view=v;
  document.getElementById('calView').style.display=v==='cal'?'':'none';
  document.getElementById('listView').style.display=v==='list'?'':'none';
  document.getElementById('bCal').className='vbtn'+(v==='cal'?' on':'');
  document.getElementById('bList').className='vbtn'+(v==='list'?' on':'');
  render();
}
function changeM(d){curMonth.setMonth(curMonth.getMonth()+d);renderCal();}
function toggleAdd(){
  const p=document.getElementById('addPanel');
  p.style.display=p.style.display==='none'?'':'none';
}
function addSS(){
  const t=document.getElementById('ss-title').value.trim();
  const d=document.getElementById('ss-date').value;
  if(!t||!d){document.getElementById('add-msg').textContent='Title and date required.';return;}
  events.push({title:t,date:d,time:document.getElementById('ss-time').value.trim(),source:'ss',url:document.getElementById('ss-url').value.trim()||SRC.ss.url,desc:document.getElementById('ss-desc').value.trim()});
  ['ss-title','ss-date','ss-time','ss-url','ss-desc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('add-msg').textContent='Added!';
  setTimeout(()=>document.getElementById('add-msg').textContent='',2000);
  render();
}
function filtered(){return events.filter(e=>filters[e.source]);}
function render(){view==='cal'?renderCal():renderList();}

function renderCal(){
  const y=curMonth.getFullYear(),m=curMonth.getMonth();
  document.getElementById('mTitle').textContent=curMonth.toLocaleString('default',{month:'long',year:'numeric'});
  const grid=document.getElementById('calGrid');grid.innerHTML='';
  const firstDay=new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate();
  const today=new Date();
  const byDay={};
  filtered().forEach(e=>{
    const ed=new Date(e.date+'T12:00:00');
    if(ed.getFullYear()===y&&ed.getMonth()===m){
      const k=ed.getDate();(byDay[k]=byDay[k]||[]).push(e);
    }
  });
  const prevDim=new Date(y,m,0).getDate();
  for(let i=0;i<firstDay;i++) grid.appendChild(mkCell(prevDim-firstDay+1+i,true,false,[]));
  for(let d=1;d<=dim;d++){
    const isT=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;
    grid.appendChild(mkCell(d,false,isT,byDay[d]||[]));
  }
  const rem=42-(firstDay+dim);
  for(let d=1;d<=rem;d++) grid.appendChild(mkCell(d,true,false,[]));
}
function mkCell(day,other,isT,evs){
  const c=document.createElement('div');
  c.className='cal-cell'+(other?' other':'')+(isT?' today':'');
  const n=document.createElement('div');n.className='day-num';n.textContent=day;c.appendChild(n);
  evs.slice(0,2).forEach(e=>{
    const p=document.createElement('div');
    p.className='pill '+SRC[e.source].cls;
    p.textContent=e.title;p.title=e.title;
    p.onclick=()=>openMod(e);c.appendChild(p);
  });
  if(evs.length>2){
    const more=document.createElement('div');more.className='more';
    more.textContent='+'+(evs.length-2)+' more';
    more.onclick=()=>openMod(evs[2]);
    c.appendChild(more);
  }
  return c;
}
function renderList(){
  const lv=document.getElementById('listView');lv.innerHTML='';
  const evs=filtered().sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(!evs.length){lv.innerHTML='<div style="padding:2rem;text-align:center;color:var(--color-text-secondary);font-size:14px">No events match the current filters.</div>';return;}
  const byDay={};
  evs.forEach(e=>{
    const k=new Date(e.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
    (byDay[k]=byDay[k]||[]).push(e);
  });
  Object.entries(byDay).forEach(([day,es])=>{
    const sec=document.createElement('div');sec.className='list-day';
    sec.innerHTML='<div class="list-day-hdr">'+day+'</div>';
    es.forEach(e=>{
      const row=document.createElement('div');row.className='list-ev';row.onclick=()=>openMod(e);
      row.innerHTML=`<div class="ev-dot" style="background:${SRC[e.source].dot}"></div>
        <div style="flex:1;min-width:0">
          <div class="ev-title">${esc(e.title)}<span class="sbadge ${SRC[e.source].cls}">${SRC[e.source].name}</span></div>
          <div class="ev-meta">${e.time||''}</div>
        </div>
        <i class="ti ti-chevron-right" aria-hidden="true" style="font-size:13px;color:var(--color-text-tertiary);margin-top:3px;flex-shrink:0"></i>`;
      sec.appendChild(row);
    });
    lv.appendChild(sec);
  });
}
function openMod(e){
  document.getElementById('mTitle2').textContent=e.title;
  document.getElementById('mMeta').innerHTML=
    '<strong>Date:</strong> '+new Date(e.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'<br>'+
    (e.time?'<strong>Time:</strong> '+esc(e.time)+'<br>':'')+
    '<strong>Source:</strong> '+SRC[e.source].name+
    (e.desc?'<br><br>'+esc(e.desc):'');
  document.getElementById('mLink').href=e.url||SRC[e.source].url;
  document.getElementById('mWrap').className='modal-wrap open';
}
function closeMod(ev){
  if(ev&&ev.target!==document.getElementById('mWrap'))return;
  document.getElementById('mWrap').className='modal-wrap';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
renderCal();
</script>
